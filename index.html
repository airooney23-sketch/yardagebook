<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>야디지북</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#111; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; overflow:hidden; }

/* ── 메인 ── */
#main { height:100%; display:flex; flex-direction:column; }
.mh { background:#1a2e1a; border-bottom:2px solid #4a9e3f; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.mh h1 { color:#f5f0e8; font-size:16px; font-weight:700; }
.mh button { background:#4a9e3f; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
#list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
.empty { text-align:center; color:#4a9e3f; opacity:.45; padding:60px 20px; font-size:14px; line-height:2.2; }
.empty b { font-size:40px; display:block; margin-bottom:6px; }
.ci { background:#1e1e1e; border:1px solid #2a2a2a; border-radius:10px; display:flex; align-items:center; gap:12px; padding:11px 13px; cursor:pointer; }
.ci:active { background:#252525; }
.ci-th { width:50px; height:50px; border-radius:7px; flex-shrink:0; overflow:hidden; background:#2a3a2a; display:flex; align-items:center; justify-content:center; font-size:22px; }
.ci-th img { width:100%; height:100%; object-fit:cover; }
.ci-name { color:#f0f0f0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ci-cnt  { color:#888; font-size:12px; margin-top:3px; }
.ci-arr  { color:#4a9e3f; font-size:20px; margin-left:auto; }

/* ── 뷰어 ── */
#viewer { position:fixed; inset:0; z-index:100; background:#000; display:none; flex-direction:column; }
#viewer.open { display:flex; }
.vh { background:#1a2e1a; border-bottom:2px solid #4a9e3f; padding:8px 10px; display:flex; align-items:center; gap:6px; flex-shrink:0; }
.vb { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:14px; font-weight:700; min-width:32px; height:32px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0 6px; }
.vb.g   { background:#4a9e3f; border-color:#4a9e3f; font-size:12px; }
.vb.r   { background:rgba(200,50,50,.15); border-color:rgba(200,50,50,.3); color:#ff7070; }
.vb.pon { background:rgba(74,158,63,.3); border-color:#4a9e3f; color:#7bc67a; }
.vb:disabled { opacity:.2; cursor:default; }
.vt { color:#f5f0e8; font-size:13px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vc { color:#7bc67a; font-size:12px; font-weight:700; flex-shrink:0; }

/* 툴바 */
.tb { display:none; background:#0e0e0e; border-bottom:1px solid #1e1e1e; padding:5px 10px; align-items:center; gap:5px; flex-shrink:0; overflow-x:auto; }
.tb.on { display:flex; }
.tc { width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0; transition:transform .12s,border-color .12s; }
.tc.on { border-color:#fff; transform:scale(1.25); }
.tdv { width:1px; height:18px; background:#333; flex-shrink:0; margin:0 2px; }
.ts { background:none; border:none; color:#555; cursor:pointer; flex-shrink:0; padding:0 2px; display:flex; align-items:center; justify-content:center; }
.ts.on { color:#fff; }
.ta { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); color:#aaa; width:26px; height:26px; border-radius:5px; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ta.on { background:rgba(255,80,80,.2); border-color:rgba(255,80,80,.4); color:#ff7070; }
.tar { margin-left:auto; display:flex; gap:4px; }

/* 사진 영역 */
#photoWrap {
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; background:#000;
  scroll-snap-type:y mandatory;
}
#photoWrap.locked { overflow:hidden; touch-action:none; }

.slot {
  position:relative; background:#000;
  scroll-snap-align:start;
  display:flex; align-items:center; justify-content:center;
}
.slot img {
  max-width:100%; max-height:100%;
  width:auto; height:auto; display:block;
  user-select:none; pointer-events:none;
}
.slot canvas {
  position:absolute; display:none;
  cursor:crosshair; touch-action:none;
}
.slot.draw canvas { display:block; }
.sdel {
  position:absolute; top:8px; right:8px;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2);
  color:#fff; font-size:12px; padding:5px 10px; border-radius:5px; cursor:pointer;
}

#vempty { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; color:#4a9e3f; opacity:.5; gap:10px; }
#vempty b { font-size:48px; }
#vempty p { font-size:14px; text-align:center; line-height:1.7; }

/* 시트 */
.sb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:300; align-items:flex-end; justify-content:center; }
.sb.open { display:flex; }
.sh { background:#1e1e1e; border-radius:18px 18px 0 0; width:100%; max-width:600px; padding:22px 20px 44px; animation:up .2s; }
@keyframes up { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
.sh h2 { color:#f0f0f0; font-size:16px; font-weight:700; margin-bottom:14px; }
.sh input { width:100%; background:#2a2a2a; border:2px solid #333; border-radius:9px; padding:11px 13px; color:#f0f0f0; font-size:15px; outline:none; }
.sh input:focus { border-color:#4a9e3f; }
.shr { display:flex; gap:10px; margin-top:14px; }
.sc { flex:1; background:none; border:1px solid #444; color:#888; padding:12px; border-radius:9px; font-size:14px; cursor:pointer; }
.so { flex:2; background:#4a9e3f; border:none; color:#fff; padding:12px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; }

/* 로딩 */
#spin { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:999; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:#fff; font-size:14px; }
#spin.on { display:flex; }
.spinner { width:36px; height:36px; border:4px solid rgba(255,255,255,.2); border-top-color:#4a9e3f; border-radius:50%; animation:sp .8s linear infinite; }
@keyframes sp { to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="main">
  <div class="mh">
    <h1>⛳ 야디지북</h1>
    <button onclick="openAdd()">+ 골프장 추가</button>
  </div>
  <div id="list">
    <div class="empty" id="emptyMsg"><b>⛳</b>골프장을 추가해서<br>야디지를 관리하세요</div>
  </div>
</div>

<div id="viewer">
  <div class="vh">
    <button class="vb" onclick="closeViewer()">←</button>
    <span class="vt" id="vTitle"></span>
    <span class="vc" id="vCount"></span>
    <button class="vb" id="penBtn" onclick="togglePen()">✏️</button>
    <button class="vb" id="prevBtn" onclick="nav(-1)">&#60;</button>
    <button class="vb" id="nextBtn" onclick="nav(1)">&#62;</button>
    <button class="vb g" onclick="pickPhoto()">+사진</button>
    <button class="vb r" onclick="delCourse()">🗑</button>
  </div>
  <div class="tb" id="toolbar">
    <button class="tc on" style="background:#FF3B30" onclick="setColor('#FF3B30',this)"></button>
    <button class="tc" style="background:#FFE033" onclick="setColor('#FFE033',this)"></button>
    <button class="tc" style="background:#34C759" onclick="setColor('#34C759',this)"></button>
    <button class="tc" style="background:#0A84FF" onclick="setColor('#0A84FF',this)"></button>
    <button class="tc" style="background:#fff" onclick="setColor('#ffffff',this)"></button>
    <button class="tc" style="background:#111;border-color:#555" onclick="setColor('#111111',this)"></button>
    <div class="tdv"></div>
    <button class="ts on" style="font-size:8px"  onclick="setSize(3,this)">●</button>
    <button class="ts"    style="font-size:14px" onclick="setSize(6,this)">●</button>
    <button class="ts"    style="font-size:22px" onclick="setSize(11,this)">●</button>
    <div class="tar">
      <button class="ta" id="eraser" onclick="toggleErase()">⌫</button>
      <button class="ta" onclick="undoDraw()">↩</button>
      <button class="ta" onclick="resetDraw()">✕</button>
    </div>
  </div>
  <div id="vempty"><b>📸</b><p>+사진 버튼으로<br>사진을 추가하세요</p></div>
  <div id="photoWrap"></div>
</div>

<input type="file" id="fileIn" accept="image/*" multiple style="display:none" onchange="onFiles(this)">

<div class="sb" id="addSheet">
  <div class="sh">
    <h2>골프장 이름</h2>
    <input id="nameIn" placeholder="예: 이글몬트CC" maxlength="30">
    <div class="shr">
      <button class="sc" onclick="closeAdd()">취소</button>
      <button class="so" onclick="confirmAdd()">추가하기</button>
    </div>
  </div>
</div>

<div id="spin"><div class="spinner"></div><span id="spinTxt">처리 중...</span></div>

<script>
// ══ 데이터 ══
// 사진은 canvas로 압축 후 localStorage에 저장
// 키: 'yb1' (고정)
const SKEY = 'yb1';
const MAX  = 1080;   // 최대 해상도
const QUAL = 0.80;   // JPEG 품질

function loadDB() {
  try { return JSON.parse(localStorage.getItem(SKEY) || 'null') || []; }
  catch(e) { return []; }
}
function saveDB() {
  try {
    localStorage.setItem(SKEY, JSON.stringify(D));
  } catch(e) {
    // 용량 초과 → 필기만 삭제하고 재시도
    D.forEach(c => { c.drw = {}; });
    try {
      localStorage.setItem(SKEY, JSON.stringify(D));
      alert('저장 공간 부족으로 필기가 초기화됐어요.\n사진은 유지됩니다.\n\nGitHub에 올리면 이 문제가 없어요!');
    } catch(e2) {
      alert('저장 공간이 꽉 찼어요. 사진을 줄여주세요.\n\nGitHub에 올리면 공간 제한이 없어요!');
    }
  }
}

// 사진 압축
function compress(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = Math.max(w, h);
        if (maxDim > MAX) {
          const s = MAX / maxDim;
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', QUAL));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let D = loadDB();   // [{ name, photos:[], drw:{} }]
let cI = 0;         // 현재 골프장 index
let pI = 0;         // 현재 사진 index

// ══ 목록 ══
function renderList() {
  const list = document.getElementById('list');
  const em   = document.getElementById('emptyMsg');
  if (!D.length) { list.innerHTML = ''; list.appendChild(em); em.style.display = 'block'; return; }
  em.style.display = 'none';
  list.innerHTML = D.map((c, i) => {
    const n  = (c.photos || []).length;
    const th = n
      ? `<div class="ci-th"><img src="${c.photos[0]}"></div>`
      : `<div class="ci-th">⛳</div>`;
    return `<div class="ci" onclick="openViewer(${i})">
      ${th}
      <div style="flex:1;min-width:0">
        <div class="ci-name">${c.name}</div>
        <div class="ci-cnt">${n}장</div>
      </div>
      <div class="ci-arr">›</div>
    </div>`;
  }).join('');
}

// ══ 골프장 추가 ══
function openAdd() {
  document.getElementById('addSheet').classList.add('open');
  setTimeout(() => document.getElementById('nameIn').focus(), 150);
}
function closeAdd() {
  document.getElementById('addSheet').classList.remove('open');
  document.getElementById('nameIn').value = '';
}
function confirmAdd() {
  const name = document.getElementById('nameIn').value.trim();
  if (!name) { alert('이름을 입력해주세요'); return; }
  D.push({ name, photos: [], drw: {} });
  saveDB(); renderList(); closeAdd();
  openViewer(D.length - 1);
}
document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAdd(); });

// ══ 뷰어 ══
function openViewer(i) {
  cI = i; pI = 0;
  if (penMode) penOff();
  document.getElementById('vTitle').textContent = D[i].name;
  document.getElementById('viewer').classList.add('open');
  buildSlots();
}
function closeViewer() {
  if (penMode) penOff();
  document.getElementById('viewer').classList.remove('open');
  renderList();
}
function delCourse() {
  if (!confirm(`"${D[cI].name}"을 삭제할까요?`)) return;
  D.splice(cI, 1); saveDB();
  document.getElementById('viewer').classList.remove('open');
  renderList();
}

// ══ 슬롯 높이 계산 ══
function getWrapH() {
  const hdr = document.querySelector('.vh').offsetHeight;
  const tb  = document.getElementById('toolbar');
  const tbH = penMode ? tb.offsetHeight : 0;
  return window.innerHeight - hdr - tbH;
}

// ══ 슬롯 빌드 ══
function buildSlots() {
  const c    = D[cI];
  const n    = (c.photos || []).length;
  const wrap = document.getElementById('photoWrap');
  const ve   = document.getElementById('vempty');

  updateNav(n);

  if (!n) {
    wrap.style.display = 'none';
    ve.style.display   = 'flex';
    return;
  }
  ve.style.display   = 'none';
  wrap.style.display = 'block';

  const h = getWrapH();
  wrap.style.height = h + 'px';

  wrap.innerHTML = c.photos.map((p, i) => `
    <div class="slot" id="sl${i}" style="height:${h}px">
      <img src="${p}" id="im${i}" onload="syncCv(${i})">
      <canvas id="cv${i}"></canvas>
      <button class="sdel" onclick="delPhoto(${i})">✕ 삭제</button>
    </div>`).join('');

  // 드로잉 복원
  Object.keys(c.drw || {}).forEach(k => restoreCv(parseInt(k)));

  // 현재 사진으로 이동
  setTimeout(() => {
    document.getElementById('sl' + pI)?.scrollIntoView({ block: 'start' });
  }, 60);

  // 스크롤 → curP 동기화
  wrap.onscroll = () => {
    if (penMode) return;
    const mid = wrap.scrollTop + h * 0.4;
    let best = 0;
    document.querySelectorAll('.slot').forEach((s, i) => { if (s.offsetTop <= mid) best = i; });
    if (pI !== best) { pI = best; updateNav(n); }
  };
}

function updateNav(n) {
  document.getElementById('vCount').textContent = n ? `${pI + 1} / ${n}` : '';
  document.getElementById('prevBtn').disabled = pI <= 0;
  document.getElementById('nextBtn').disabled = pI >= n - 1;
}

function nav(dir) {
  const n = (D[cI].photos || []).length;
  const next = Math.max(0, Math.min(n - 1, pI + dir));
  if (next === pI) return;
  pI = next;
  document.getElementById('sl' + pI)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateNav(n);
  if (penMode) activateSlot(pI);
}

// ══ 캔버스 맞추기 ══
function syncCv(i) {
  const img  = document.getElementById('im' + i);
  const cv   = document.getElementById('cv' + i);
  const wrap = document.getElementById('photoWrap');
  if (!img || !cv || !img.naturalWidth) return;
  const ww = wrap.clientWidth;
  const wh = getWrapH();
  const s  = Math.min(ww / img.naturalWidth, wh / img.naturalHeight);
  const rw = Math.round(img.naturalWidth * s);
  const rh = Math.round(img.naturalHeight * s);
  cv.width  = rw; cv.height = rh;
  cv.style.cssText = `width:${rw}px;height:${rh}px;left:${Math.round((ww-rw)/2)}px;top:${Math.round((wh-rh)/2)}px;`;
  restoreCv(i);
}

function restoreCv(i) {
  const cv = document.getElementById('cv' + i);
  const d  = D[cI]?.drw?.[i];
  if (!cv || !d || !cv.width) return;
  const t = new Image();
  t.onload = () => cv.getContext('2d').drawImage(t, 0, 0, cv.width, cv.height);
  t.src = d;
}

function saveCv(i) {
  const cv = document.getElementById('cv' + i);
  if (!cv || !cv.width) return;
  if (!D[cI].drw) D[cI].drw = {};
  D[cI].drw[i] = cv.toDataURL('image/png');
  saveDB();
}

// ══ 업로드 ══
function pickPhoto() { const f = document.getElementById('fileIn'); f.value = ''; f.click(); }

async function onFiles(inp) {
  const files = Array.from(inp.files);
  if (!files.length) return;
  const spin = document.getElementById('spin');
  const txt  = document.getElementById('spinTxt');
  spin.classList.add('on');
  const c = D[cI];
  const first = c.photos.length;
  for (let i = 0; i < files.length; i++) {
    txt.textContent = `${i + 1} / ${files.length} 사진 처리 중...`;
    c.photos.push(await compress(files[i]));
  }
  saveDB(); spin.classList.remove('on');
  renderList(); pI = first; buildSlots();
}

// ══ 삭제 ══
function delPhoto(i) {
  if (!confirm('이 사진을 삭제할까요?')) return;
  const c = D[cI];
  c.photos.splice(i, 1);
  const nd = {};
  Object.keys(c.drw || {}).forEach(k => {
    const ki = parseInt(k);
    if (ki < i) nd[ki] = c.drw[k];
    else if (ki > i) nd[ki - 1] = c.drw[k];
  });
  c.drw = nd; saveDB(); renderList();
  pI = Math.max(0, Math.min(pI, c.photos.length - 1));
  buildSlots();
}

// ══ 펜 모드 ══
let penMode = false, penColor = '#FF3B30', penSize = 3, isEr = false;
let drawing = false, lx = 0, ly = 0, actIdx = null;
let undoStack = [];

function togglePen() {
  penMode = !penMode;
  document.getElementById('penBtn').classList.toggle('pon', penMode);
  document.getElementById('toolbar').classList.toggle('on', penMode);
  const wrap = document.getElementById('photoWrap');
  wrap.classList.toggle('locked', penMode);
  // 슬롯 높이 재계산 (툴바 열리면 줄어듦)
  const h = getWrapH();
  wrap.style.height = h + 'px';
  document.querySelectorAll('.slot').forEach(s => s.style.height = h + 'px');
  document.querySelectorAll('.slot').forEach((_, i) => syncCv(i));
  if (penMode) activateSlot(pI);
  else {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('draw'));
    document.querySelectorAll('.sdel').forEach(b => b.style.display = 'block');
  }
}
function penOff() {
  penMode = false;
  document.getElementById('penBtn').classList.remove('pon');
  document.getElementById('toolbar').classList.remove('on');
  document.getElementById('photoWrap').classList.remove('locked');
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('draw'));
}
function activateSlot(i) {
  document.querySelectorAll('.slot').forEach((s, j) => {
    s.classList.toggle('draw', j === i);
    const b = s.querySelector('.sdel');
    if (b) b.style.display = 'none';
  });
  document.getElementById('sl' + i)?.scrollIntoView({ block: 'start' });
}

function setColor(c, btn) { penColor = c; isEr = false; document.getElementById('eraser').classList.remove('on'); document.querySelectorAll('.tc').forEach(b => b.classList.toggle('on', b === btn)); }
function setSize(s, btn)  { penSize = s; document.querySelectorAll('.ts').forEach(b => b.classList.toggle('on', b === btn)); }
function toggleErase()    { isEr = !isEr; document.getElementById('eraser').classList.toggle('on', isEr); }

function gp(e, cv) {
  const r = cv.getBoundingClientRect(), s = e.touches ? e.touches[0] : e;
  return { x: (s.clientX - r.left) * (cv.width / r.width), y: (s.clientY - r.top) * (cv.height / r.height) };
}
function stroke(p, cv) {
  const ctx = cv.getContext('2d');
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (isEr) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = penSize * 5; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
  else      { ctx.globalCompositeOperation = 'source-over';     ctx.lineWidth = penSize;     ctx.strokeStyle = penColor; }
  ctx.stroke();
}

const pw = document.getElementById('photoWrap');
pw.addEventListener('touchstart', e => {
  if (!penMode) return;
  const cv = e.target.closest('canvas'); if (!cv) return;
  e.preventDefault(); drawing = true;
  actIdx = parseInt(cv.id.replace('cv', ''));
  undoStack.push(cv.toDataURL()); if (undoStack.length > 20) undoStack.shift();
  const p = gp(e, cv); lx = p.x; ly = p.y;
}, { passive: false });

pw.addEventListener('touchmove', e => {
  if (penMode) e.preventDefault();
  if (!penMode || !drawing || actIdx === null) return;
  const cv = document.getElementById('cv' + actIdx); if (!cv) return;
  const p = gp(e, cv); stroke(p, cv); lx = p.x; ly = p.y;
}, { passive: false });

pw.addEventListener('touchend', () => {
  if (!drawing) return; drawing = false; saveCv(actIdx); actIdx = null;
}, { passive: false });

pw.addEventListener('mousedown', e => {
  if (!penMode) return; const cv = e.target.closest('canvas'); if (!cv) return;
  drawing = true; actIdx = parseInt(cv.id.replace('cv', ''));
  undoStack.push(cv.toDataURL()); if (undoStack.length > 20) undoStack.shift();
  const p = gp(e, cv); lx = p.x; ly = p.y;
});
pw.addEventListener('mousemove', e => {
  if (!penMode || !drawing || actIdx === null) return;
  const cv = document.getElementById('cv' + actIdx); if (!cv) return;
  const p = gp(e, cv); stroke(p, cv); lx = p.x; ly = p.y;
});
pw.addEventListener('mouseup', () => { if (!drawing) return; drawing = false; saveCv(actIdx); actIdx = null; });

function undoDraw() {
  if (!undoStack.length) return;
  const i  = actIdx !== null ? actIdx : pI;
  const cv = document.getElementById('cv' + i); if (!cv) return;
  const t  = new Image();
  t.onload = () => { cv.getContext('2d').clearRect(0,0,cv.width,cv.height); cv.getContext('2d').drawImage(t,0,0,cv.width,cv.height); saveCv(i); };
  t.src = undoStack.pop();
}
function resetDraw() {
  if (!confirm('이 사진의 필기를 지울까요?')) return;
  const cv = document.getElementById('cv' + pI); if (!cv) return;
  undoStack.push(cv.toDataURL());
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); saveCv(pI);
}

window.addEventListener('resize', () => {
  if (!document.getElementById('viewer').classList.contains('open')) return;
  const h = getWrapH();
  const wrap = document.getElementById('photoWrap');
  wrap.style.height = h + 'px';
  document.querySelectorAll('.slot').forEach(s => s.style.height = h + 'px');
  document.querySelectorAll('.slot').forEach((_, i) => syncCv(i));
});

renderList();
</script>
</body>
</html>
